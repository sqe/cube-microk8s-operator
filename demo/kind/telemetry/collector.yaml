apiVersion: v1
kind: ServiceAccount
metadata: {name: telemetry-collector, namespace: cube-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cube-demo-telemetry-reader}
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cube-demo-telemetry-reader}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cube-demo-telemetry-reader}
subjects:
  - {kind: ServiceAccount, name: telemetry-collector, namespace: cube-demo}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: telemetry-collector, namespace: cube-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: telemetry-collector}}
  template:
    metadata: {labels: {app: telemetry-collector}}
    spec:
      serviceAccountName: telemetry-collector
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: cube-operator:v0.1.0
          imagePullPolicy: IfNotPresent
          args: [telemetry-collector]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: cube-configuration, key: DATABASE_URL}}
            - {name: CLUSTER_NAME, value: kind-cube-demo}
            - {name: COLLECTION_INTERVAL, value: 15s}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
