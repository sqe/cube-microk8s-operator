apiVersion: v1
kind: Service
metadata: {name: agent-ingest, namespace: cube-demo}
spec:
  selector: {app: agent-ingest}
  ports: [{name: http, port: 8082, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-ingest, namespace: cube-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-ingest}}
  template:
    metadata: {labels: {app: agent-ingest}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ingest
          image: cube-operator:v0.1.0
          imagePullPolicy: IfNotPresent
          args: [agent-ingest]
          ports: [{name: http, containerPort: 8082}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: cube-configuration, key: DATABASE_URL}}
            - name: AGENT_INGEST_TOKEN
              valueFrom: {secretKeyRef: {name: agent-ingest, key: token}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
