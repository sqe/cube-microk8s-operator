apiVersion: v1
kind: Namespace
metadata:
  name: cube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cube-operator
  namespace: cube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-operator-kopf
  namespace: cube-system
  labels:
    app.kubernetes.io/name: cube-operator-kopf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cube-operator-kopf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube-operator-kopf
    spec:
      serviceAccountName: cube-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: cube-operator-kopf:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
