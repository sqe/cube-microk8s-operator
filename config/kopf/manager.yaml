apiVersion: v1
kind: Namespace
metadata:
  name: cube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cube-operator
  namespace: cube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cube-operator-kopf-discovery
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cube-operator-kopf-discovery
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cube-operator-kopf-discovery}
subjects:
  - {kind: ServiceAccount, name: cube-operator, namespace: cube-system}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-operator-kopf
  namespace: cube-system
  labels:
    app.kubernetes.io/name: cube-operator-kopf
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: cube-operator-kopf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube-operator-kopf
    spec:
      serviceAccountName: cube-operator
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
      containers:
        - name: manager
          image: cube-operator-kopf:v0.1.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          ports:
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
