apiVersion: v1
kind: Namespace
metadata:
  name: cube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cube-operator
  namespace: cube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-operator
  namespace: cube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cube-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cube-operator
    spec:
      serviceAccountName: cube-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: cube-operator:v0.1.0
          imagePullPolicy: IfNotPresent
          args: ["--leader-elect"]
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
