name: Kind end-to-end

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        controller: [go, kopf]
    env:
      CONTROLLER: ${{ matrix.controller }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Kind
        run: |
          mkdir -p "$RUNNER_TEMP/kind-bin"
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind-bin/kind"
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64.sha256sum | sed 's/kind-linux-amd64/kind/' > "$RUNNER_TEMP/kind-bin/checksums.txt"
          (cd "$RUNNER_TEMP/kind-bin" && sha256sum -c checksums.txt)
          chmod +x "$RUNNER_TEMP/kind-bin/kind"
          echo "$RUNNER_TEMP/kind-bin" >> "$GITHUB_PATH"
      - name: Build and deploy real stack
        run: bash scripts/kind-up.sh
      - name: Query and exercise agent telemetry before and after pod replacement
        run: bash scripts/kind-e2e.sh
      - name: Verify repeated setup preserves data and reloads models
        run: |
          bash scripts/kind-up.sh
          bash scripts/kind-e2e.sh
      - name: Collect diagnostics (no Secrets)
        if: always()
        run: |
          mkdir -p evidence
          kubectl --context kind-cube-demo get pods -A -o wide > evidence/pods.txt 2>&1 || true
          kubectl --context kind-cube-demo -n cube-demo get cubeclusters,deployments,statefulsets -o yaml > evidence/workloads.yaml 2>&1 || true
          kubectl --context kind-cube-demo get events -A --sort-by=.lastTimestamp > evidence/events.txt 2>&1 || true
          for workload in agent-ingest telemetry-api telemetry-refresh-worker telemetry-collector; do
            kubectl --context kind-cube-demo -n cube-demo logs "deployment/$workload" --tail=200 > "evidence/$workload.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kind-e2e-${{ matrix.controller }}
          path: evidence/
      - name: Delete disposable cluster
        if: always()
        run: kind delete cluster --name cube-demo
