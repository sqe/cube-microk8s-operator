name: CI and development packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cube
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: telemetry
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U cube -d telemetry" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cube:test-only@localhost:5432/telemetry?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation tools
        run: |
          python -m pip install PyYAML==6.0.3
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Verify repository
        run: |
          make verify
          go test -race ./...
          actionlint

  e2e:
    needs: test
    uses: ./.github/workflows/e2e.yaml

  images:
    needs: [test, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cube-operator
            dockerfile: Dockerfile
          - image: cube-operator-kopf
            dockerfile: python/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Image namespace
        id: names
        run: echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish development image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.names.outputs.registry }}/${{ matrix.image }}:edge
            ${{ steps.names.outputs.registry }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Record published package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.names.outputs.registry }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Published development image: \`$IMAGE@$DIGEST\` (tags \`edge\` and \`sha-$GITHUB_SHA\`)." >> "$GITHUB_STEP_SUMMARY"
